<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Esper Ayla | Amal Iman Ameen</title>

<meta name="description"
      content="Esper Ayla — the literary world of Amal Iman Ameen, author and novel artist. Stories for the beautiful things that hurt.">

<meta name="author"
      content="Amal Iman Ameen">

<meta name="robots"
      content="index, follow">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   FOUNDATION
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #0b0a0b;
    color: #eee9e1;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
}


/* =========================================================
   GRAIN
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0.045;

    z-index: 9999;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");

    background-size: 180px 180px;
}


/* =========================================================
   NAVIGATION
========================================================= */

nav {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    padding: 28px 5vw;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 1000;

    mix-blend-mode: normal;
}

.logo {
    font-family: 'Cormorant Garamond', serif;

    font-size: 1.05rem;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #eee9e1;

    text-decoration: none;
}

.nav-links {
    display: flex;
    gap: 34px;
}

.nav-links a {
    color: #eee9e1;

    text-decoration: none;

    font-size: 0.62rem;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: 0.62;

    transition: opacity 0.4s ease,
                color 0.4s ease;
}

.nav-links a:hover {
    opacity: 1;
    color: #c8b28a;
}


/* =========================================================
   HERO
========================================================= */

.hero {

    min-height: 100vh;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:

        radial-gradient(
            ellipse at 50% 45%,
            rgba(75, 52, 58, 0.16),
            transparent 52%
        ),

        #0b0a0b;
}


/* =========================================================
   HUGE BACKGROUND TYPOGRAPHY
========================================================= */

.hero-word {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -52%);

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(11rem, 27vw, 30rem);

    font-weight: 300;

    letter-spacing: -0.06em;

    line-height: 0.7;

    color: rgba(238, 233, 225, 0.018);

    white-space: nowrap;

    user-select: none;

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   ATMOSPHERIC LIGHT
========================================================= */

.atmosphere {

    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 850px;
    max-height: 850px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(109, 38, 56, 0.12),
            rgba(109, 38, 56, 0.035) 35%,
            transparent 70%
        );

    filter: blur(30px);

    animation: breathe 12s ease-in-out infinite alternate;

    pointer-events: none;
}

@keyframes breathe {

    from {
        transform: scale(0.94);
        opacity: 0.65;
    }

    to {
        transform: scale(1.06);
        opacity: 1;
    }

}


/* =========================================================
   HERO CONTENT
========================================================= */

.hero-content {

    position: relative;

    z-index: 5;

    width: min(1200px, 90vw);

    text-align: center;

    padding-top: 40px;
}


/* small editorial label */

.hero-kicker {

    font-size: 0.62rem;

    letter-spacing: 6px;

    text-transform: uppercase;

    color: #c8b28a;

    margin-bottom: 35px;

    opacity: 0.8;
}


/* =========================================================
   MAIN NAME
========================================================= */

.hero-title {

    font-family: 'Cormorant Garamond', serif;

    font-weight: 400;

    font-size: clamp(
        5rem,
        13vw,
        12.5rem
    );

    line-height: 0.72;

    letter-spacing: -0.055em;

    text-transform: uppercase;

    color: #eee9e1;

    margin-left: -0.055em;
}


/* =========================================================
   REAL NAME
========================================================= */

.hero-real-name {

    margin-top: 34px;

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(
        1rem,
        1.8vw,
        1.45rem
    );

    letter-spacing: 4px;

    color: #cfc7bd;

    opacity: 0.8;
}


/* =========================================================
   AUTHOR DESCRIPTION
========================================================= */

.hero-role {

    margin-top: 10px;

    font-size: 0.62rem;

    letter-spacing: 4px;

    text-transform: uppercase;

    opacity: 0.45;
}


/* =========================================================
   TAGLINE
========================================================= */

.hero-tagline {

    margin: 65px auto 45px;

    max-width: 850px;

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(
        2rem,
        4vw,
        4rem
    );

    font-weight: 300;

    line-height: 1.05;

    letter-spacing: -0.02em;

    color: #eee9e1;
}

.hero-tagline em {
    color: #c8b28a;
    font-style: italic;
}


/* =========================================================
   ENTER
========================================================= */

.enter {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    color: #eee9e1;

    text-decoration: none;

    font-size: 0.62rem;

    letter-spacing: 4px;

    text-transform: uppercase;

    padding: 15px 0;

    transition: gap 0.5s ease,
                color 0.4s ease;
}

.enter::after {

    content: "→";

    font-size: 1rem;

    transition: transform 0.5s ease;
}

.enter:hover {

    gap: 30px;

    color: #c8b28a;
}

.enter:hover::after {

    transform: translateX(5px);
}


/* =========================================================
   SCROLL INDICATOR
========================================================= */

.scroll-indicator {

    position: absolute;

    bottom: 32px;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;

    opacity: 0.35;

    z-index: 5;
}

.scroll-indicator span {

    font-size: 0.5rem;

    letter-spacing: 3px;

    text-transform: uppercase;
}

.scroll-line {

    width: 1px;

    height: 42px;

    background: #eee9e1;

    animation: scrollPulse 2.5s ease-in-out infinite;
}

@keyframes scrollPulse {

    0%, 100% {
        transform: scaleY(0.4);
        transform-origin: top;
        opacity: 0.3;
    }

    50% {
        transform: scaleY(1);
        transform-origin: top;
        opacity: 1;
    }

}


/* =========================================================
   PLACEHOLDER NEXT SECTION
   ========================================================= */

.world-preview {

    min-height: 100vh;

    background: #111011;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 100px 8%;
}

.world-preview-inner {

    max-width: 900px;
}

.world-label {

    font-size: 0.6rem;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: #c8b28a;

    margin-bottom: 25px;
}

.world-preview h2 {

    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(
        3.5rem,
        8vw,
        8rem
    );

    font-weight: 300;

    line-height: 0.9;

    letter-spacing: -0.04em;
}

.world-preview p {

    margin-top: 30px;

    opacity: 0.5;

    font-family: 'Cormorant Garamond', serif;

    font-size: 1.3rem;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    nav {
        padding: 20px 5vw;
    }

    .logo {
        font-size: 0.85rem;
        letter-spacing: 2px;
    }

    .nav-links {
        gap: 13px;
    }

    .nav-links a {
        font-size: 0.5rem;
        letter-spacing: 1.5px;
    }

    .hero-content {
        width: 92vw;
    }

    .hero-title {
        font-size: clamp(
            4.2rem,
            19vw,
            7rem
        );

        line-height: 0.78;
    }

    .hero-real-name {
        font-size: 0.85rem;
        letter-spacing: 2px;
    }

    .hero-role {
        font-size: 0.5rem;
        letter-spacing: 2px;
    }

    .hero-tagline {
        margin-top: 48px;
        font-size: 2rem;
        line-height: 1.05;
    }

    .hero-word {
        font-size: 45vw;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav>

    <a href="index.html"
       class="logo">

        Esper Ayla

    </a>


    <div class="nav-links">

        <a href="mavis.html">
            Mavis
        </a>

        <a href="about.html">
            About
        </a>

        <a href="connect.html">
            Connect
        </a>

    </div>

</nav>



<!-- =====================================================
     HERO
===================================================== -->

<header class="hero"
        id="top">


    <!-- enormous background word -->

    <div class="hero-word">
        AYLA
    </div>


    <!-- atmospheric darkness -->

    <div class="atmosphere"></div>


    <div class="hero-content">


        <div class="hero-kicker">

            Author · Novel Artist

        </div>


        <h1 class="hero-title">

            Esper Ayla

        </h1>


        <div class="hero-real-name">

            Amal Iman Ameen

        </div>


        <div class="hero-role">

            Writing · Worlds · Stories

        </div>


        <div class="hero-tagline">

            Stories for the <em>beautiful things</em> that hurt.

        </div>


        <a href="#worlds"
           class="enter">

            Enter the world

        </a>


    </div>


    <div class="scroll-indicator">

        <span>Scroll</span>

        <div class="scroll-line"></div>

    </div>


</header>



<!-- =====================================================
     TEMPORARY NEXT SECTION
===================================================== -->

<section class="world-preview"
         id="worlds">

    <div class="world-preview-inner">

        <div class="world-label">

            The worlds begin here

        </div>

        <h2>

            Stories become worlds.

        </h2>

        <p>

            More coming soon.

        </p>

    </div>

</section>


</body>

</html>
